name: soup-of-the-day
on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update soup line
        run: |
          soups=("Tomato" "Ramen" "Carrot ginger" "Lentil" "Corn chowder" "Miso" "Broth")
          today=${soups[$(( $(date +%u) - 1 ))]}
          sed -i "s|^<!--SOUP-->.*|<!--SOUP--> Today's soup: **$today**|" README.md
      - name: Commit
        run: |
          git config user.name "soup-bot"
          git config user.email "soup-bot@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: update soup of the day"
          git push
